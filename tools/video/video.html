<style>

<script>
"use strict";
const W = 1920, H = 1080, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const eio = x => { x = clamp(x); return x * x * (3 - 2 * x); }, eo = x => 1 - Math.pow(1 - clamp(x), 3), eback = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(s) { return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const es = (v, d = 0) => v.toLocaleString("es-ES", {minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always"});
const pct = v => (v > 0 ? "+" : "") + es(v, 2) + " %";

/* ---------- escenas y tiempos ---------- */
const ESC = [["logo", 7.4], ["ind", 6.6], ["hoy", 7.2], ["bolsa", 7.8], ["sim", 8.6], ["news", 6.8], ["juegos", 7.2], ["tit", 6.6], ["fin", 8.2]];
let acc = 0; const T0 = {}; ESC.forEach(e => { T0[e[0]] = acc; acc += e[1]; }); const DUR = acc, X = 0.35;
const stage = $("#stage"), EL = {};
ESC.forEach(([id]) => { const d = document.createElement("div"); d.className = "sc"; d.id = "s-" + id; stage.appendChild(d); EL[id] = d; });
function rvInit(root) { $$(".rv", root).forEach(el => { el.innerHTML = el.innerHTML.split(/(<em>.*?<\/em>|\s+)/).filter(x => x && x.trim()).map(x => x.startsWith("<em>") ? x.slice(4, -5).split(/\s+/).map(y => `<span class="w"><i><em>${y}</em></i></span>`).join(" ") : `<span class="w"><i>${x}</i></span>`).join(" "); }); }
function rv(el, p) { const ws = el._w || (el._w = $$(".w > i", el)), n = ws.length; ws.forEach((w, k) => { const q = eo(clamp(p * (1 + 0.6) - 0.6 * k / n)); w.style.transform = `translateY(${(1 - q) * 115}%)`; }); }
const show = (el, o, tr = "") => { el.style.opacity = o; el.style.transform = tr; };
const lockHTML = `<div class="lock" style="top:270px"><div class="sp"></div><div class="wm"><span class="a">CCEE</span><span class="b">scopio</span> <span class="c">D+I</span></div></div>`;

/* ---------- fondo: partículas de datos ---------- */
const bg = $("#bg").getContext("2d"), fx = $("#fx").getContext("2d");
const COL = ["#F29200", "#F0479A", "#B5175F", "#FFE2F0"], SPR = COL.map(c => { const k = document.createElement("canvas"); k.width = k.height = 64; const g = k.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, c); r.addColorStop(.25, c + "cc"); r.addColorStop(1, c + "00"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return k; });
const R = rng(20261124), P = [];
function addT(n, col, f) { for (let i = 0; i < n; i++) { const [x, y] = f(); P.push({tx: x, ty: y, c: col}); } }
addT(430, 0, () => { const a = R() * 6.2832, r = 58 + R() * 16; return [86 + r * Math.cos(a), 86 + r * Math.sin(a)]; });                              // lente
addT(170, 2, () => { const u = R(), o = (R() - .5) * 20; return [128 + 50 * u + o * .7, 128 + 50 * u - o * .7]; });                                // mango
[[50, 98, 28], [72, 82, 44], [94, 66, 60], [116, 74, 52]].forEach((b, k) => addT(70 + b[2], k === 3 ? 3 : 1, () => [b[0] + R() * 15, b[1] + R() * b[2]])); // barras
const PL = [[50, 86], [72, 70], [94, 54], [124, 48]]; addT(120, 0, () => { const k = Math.floor(R() * 3), u = R(); return [lerp(PL[k][0], PL[k + 1][0], u) + (R() - .5) * 5, lerp(PL[k][1], PL[k + 1][1], u) + (R() - .5) * 5]; });
addT(45, 0, () => { const a = R() * 6.2832, r = Math.sqrt(R()) * 7; return [124 + r * Math.cos(a), 48 + r * Math.sin(a)]; });
for (let i = 0; i < 330; i++) P.push({c: Math.floor(R() * 3)});                                                                                      // ambiente
P.forEach(p => { p.hx = (R() - .5) * 3400; p.hy = (R() - .5) * 2000; p.hz = R() * 1700 - 500; p.s = 5 + R() * 9; p.d = R(); p.ph = R() * 6.28; });
const L = {x: 700, y: 250, s: 2.6};      // posición y escala del icono (lo fijan las escenas 0 y 8)
let PM = 0, PA = 1, AMB = 0.5;           // convergencia hacia el logo, opacidad de las partículas del logo y del ambiente
function fondo(t) {
  bg.globalCompositeOperation = "source-over"; bg.fillStyle = "#10050B"; bg.fillRect(0, 0, W, H);
  [[520 + 260 * Math.sin(t * .11), 380 + 160 * Math.cos(t * .09), 900, "181,23,95", .34], [1450 + 220 * Math.cos(t * .08), 760 + 140 * Math.sin(t * .13), 820, "242,146,0", .2]].forEach(g => {
    const r = bg.createRadialGradient(g[0], g[1], 0, g[0], g[1], g[2]); r.addColorStop(0, `rgba(${g[3]},${g[4]})`); r.addColorStop(1, `rgba(${g[3]},0)`); bg.fillStyle = r; bg.fillRect(0, 0, W, H); });
  bg.globalCompositeOperation = "lighter";
  const ca = Math.cos(t * .05), sa = Math.sin(t * .05), f = 1000;
  for (const p of P) {
    const x = p.hx * ca - p.hz * sa, z = p.hx * sa + p.hz * ca + 700, y = p.hy + 40 * Math.sin(t * .4 + p.ph);
    if (z < -f + 80) continue;
    const k = f / (f + z); let sx = W / 2 + x * k, sy = H / 2 + y * k, sz = p.s * k * 2.2, al = AMB * clamp(k) * (0.6 + 0.4 * Math.sin(t * 1.3 + p.ph));
    if (p.tx !== undefined) {
      const m = eio(clamp(PM * 1.5 - p.d * 0.5));
      sx = lerp(sx, L.x + p.tx * L.s, m) + (1 - m) * m * 260 * Math.sin(p.ph * 3); sy = lerp(sy, L.y + p.ty * L.s, m) + (1 - m) * m * 260 * Math.cos(p.ph * 3);
      sz = lerp(sz, 7 + L.s * 2.2, m); al = lerp(al, PA, m);
    }
    if (al <= 0.01 || sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    bg.globalAlpha = Math.min(1, al); bg.drawImage(SPR[p.c], sx - sz, sy - sz, sz * 2, sz * 2);
  }
  bg.globalAlpha = 1;
}
const icon = $("#icon"), flash = $("#flash");
function ponIcono(o) { icon.style.display = o > 0 ? "block" : "none"; icon.style.opacity = o; icon.style.transform = `translate(${L.x}px,${L.y}px) scale(${L.s})`; }
function ponFlash(o, cx, cy) { flash.style.display = o > 0.01 ? "block" : "none"; flash.style.opacity = o; flash.style.left = (cx - 700) + "px"; flash.style.top = (cy - 700) + "px"; }
let LOCK = null;
function medirLock(root) { const r = $(".sp", root).getBoundingClientRect(); return {x: r.left, y: r.top, s: 1.5}; }
function logoAnim(root, t, t0) {     // ensamblaje del logo: común a la apertura y al cierre
  const big = {x: 960 - 286, y: 420 - 286 + 30, s: 2.86}, mv = eio(seg(t, t0 + 2.0, t0 + 3.0));
  L.x = lerp(big.x, LOCK.x, mv); L.y = lerp(big.y, LOCK.y, mv); L.s = lerp(big.s, LOCK.s, mv);
  PM = seg(t, t0, t0 + 1.9); const cr = seg(t, t0 + 1.7, t0 + 2.2); PA = 1 - cr * 0.96; ponIcono(cr);
  const fl = seg(t, t0 + 1.6, t0 + 1.95) * (1 - seg(t, t0 + 1.95, t0 + 2.9)); ponFlash(fl * 0.85, L.x + 100 * L.s, L.y + 100 * L.s);
  const wm = $(".wm", root), p = eo(seg(t, t0 + 2.5, t0 + 3.5)); wm.style.clipPath = `inset(-20% ${100 - 100 * p}% -20% 0)`; wm.style.transform = `translateX(${(1 - p) * -70}px)`;
  const sw = seg(t, t0 + 3.3, t0 + 4.3); $$("span", wm).forEach(s => s.style.backgroundPosition = `${100 - 100 * sw}% 0`);
}

/* ---------- 0. Apertura ---------- */
EL.logo.innerHTML = `<div class="abs h rv" id="l-q" style="left:0;top:420px;width:1920px;padding:0 200px;text-align:center;font-size:96px">Cada día, la economía genera <em>millones de datos</em></div>${lockHTML}
  <div class="tag sub" id="l-t1" style="top:625px;font-size:56px;font-weight:700;color:#FFC56B">Observando la economía y la empresa</div>
  <div class="tag sub" id="l-t2" style="top:730px">Docencia + Investigación · Facultad de Ciencias Económicas y Empresariales · Universidad de Granada</div>`;
const S = {};
S.logo = t => {
  AMB = 0.75; const q = $("#l-q"); rv(q, seg(t, 0.25, 1.3)); q.style.opacity = 1 - seg(t, 2.1, 2.6);
  logoAnim(EL.logo, t, 2.2);
  show($("#l-t1"), eo(seg(t, 5.2, 5.8)), `translateY(${(1 - eo(seg(t, 5.2, 5.8))) * 30}px)`); show($("#l-t2"), eo(seg(t, 5.6, 6.2)));
};

/* ---------- 1. 99 indicadores ---------- */
const IND = ["Inflación (IPCA)", "Tasa de paro", "PIB: crecimiento", "Pernoctaciones en hoteles", "Deuda pública", "Euríbor a 3 meses", "Índice de Gini", "Energías renovables", "Población", "Exportaciones", "Paro juvenil", "Precio de la vivienda", "I+D sobre el PIB", "Confianza del consumidor",
  "Empresas que usan IA", "Riesgo de pobreza", "Producción industrial", "Bono a 10 años", "Comercio electrónico", "Esperanza de vida", "Tasa de empleo", "Precio de la electricidad", "Cuenta corriente", "Emisiones de CO₂", "Salario mínimo", "Turistas internacionales", "Nuevas empresas", "PIB por habitante"];
{ const r = rng(77); let h = ""; IND.forEach((n, i) => { const cx = i % 7, cy = Math.floor(i / 7); let v = 50, d = ""; for (let k = 0; k <= 24; k++) { v = clamp(v + (r() - .46) * 22, 8, 92); d += `${k ? "L" : "M"}${(k * 12).toFixed(0)},${(78 - v * .7).toFixed(1)}`; }
  h += `<div class="wc" style="left:${(cx - 3.5) * 366}px;top:${(cy - 2) * 226}px"><b>${n}</b><small>${["Mensual", "Trimestral", "Anual"][i % 3]} · Eurostat</small><svg width="288" height="80"><path d="${d}" fill="none" stroke="${i % 2 ? "#F29200" : "#F0479A"}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/></svg></div>`; });
  EL.ind.innerHTML = `<div id="wallp"><div id="wall">${h}</div></div><div id="scrim"></div>
  <div class="abs" style="left:0;top:215px;width:1920px;text-align:center"><div id="n99">0</div><div class="h rv" id="i-h" style="margin-top:6px">indicadores <em>en directo</em></div>
