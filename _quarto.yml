  page-footer:
    left: "CCEEscopio · Facultad de Ciencias Económicas y Empresariales · Universidad de Granada · Gestionado por el Vicedecanato de Investigación, Transferencia y Posgrado · [investiga_ccee@ugr.es](mailto:investiga_ccee@ugr.es)"
