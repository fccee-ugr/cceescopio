  favicon: images/brand/cceescopio_icono.png
  page-navigation: true
  open-graph: true
  twitter-card: true
  image: images/brand/cceescopio_logo.png
  back-to-top-navigation: true
  search: true
  navbar:
    logo: images/brand/cceescopio_navbar.png
    logo-alt: "Logo de CCEEscopio"
    title: false
    left:
      - href: index.qmd
        text: Inicio
      - text: Indicadores
        menu:
          - href: precios.qmd
            text: "Precios e inflación"
          - href: empleo.qmd
            text: "Mercado laboral"
          - href: actividad.qmd
            text: "Actividad económica y coyuntura"
          - href: empresa.qmd
            text: "Empresa, innovación y digitalización"
          - href: turismo.qmd
            text: "Turismo"
          - href: publico.qmd
            text: "Sector público y mercados financieros"
          - href: desigualdad.qmd
            text: "Desigualdad y condiciones de vida"
          - href: sostenibilidad.qmd
            text: "Energía y sostenibilidad"
          - text: "---"
          - href: andalucia.qmd
            text: "Andalucía y las regiones españolas"
      - href: rankings.qmd
